<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Каталог и справочник — Технополив</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="catalog.css">
<script defer src="catalog.js"></script>
</head>
<body>
<header class="directory-header"><div class="wrap directory-nav">
  <a class="brand" href="./">Технополив</a>
  <nav aria-label="Основная навигация"><a href="./">Главная</a><a href="./#services">Услуги</a><a href="./#contacts">Контакты</a></nav>
  <a class="directory-phone" href="tel:+79282024242">+7 928 202-42-42</a>
</div></header>
<main class="wrap directory" id="directory">
  <h1>Каталог и справочник</h1>
  <form class="directory-search" id="directory-search" role="search">
    <label for="directory-query">Найти по названию, артикулу или производителю</label>
    <div><input id="directory-query" name="q" type="search" placeholder="Например, фильтр или COMET"><button class="button lime">Найти</button></div>
  </form>
  <div class="directory-filters" role="group" aria-label="Раздел каталога">
    <button data-type="product" aria-pressed="false">Товары</button>
    <button data-type="category" aria-pressed="false">Категории</button>
    <button data-type="article" aria-pressed="false">Статьи</button>
    <button data-type="page" aria-pressed="false">Справочник</button>
    <button data-type="all" aria-pressed="false">Все разделы</button>
  </div>
  <label class="directory-category" hidden>Категория <select id="directory-category"><option value="">Все категории</option></select></label>
  <p id="directory-status" class="directory-meta" role="status">Загружаем каталог…</p>
  <div class="directory-grid" id="directory-results"></div>
  <button id="directory-more" class="button lime" type="button" hidden>Показать ещё</button>
  <p class="directory-meta" id="directory-date"></p>
</main>
<footer class="directory-footer"><div class="wrap"><a href="https://технополив.рф/magazin">Магазин Технополив.рф ↗</a><a href="./#contacts">Контакты</a></div></footer>
</body>
</html>
